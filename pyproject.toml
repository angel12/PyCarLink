[project]
name = "pycarlink"
version = "0.1.0"
description = "Unofficial Python client for Carlink / mycarcontrols.com / CL6"
readme = "README.md"
dependencies = ["requests"]

[tool.setuptools]
packages = ["pycarlink"]
